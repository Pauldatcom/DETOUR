# ============================================
# DÉTOUR CI
# ============================================
# Runs on every pull request:
#   - tests  : the two Python unittest suites (standard library only)
#   - lint   : ESLint, Prettier and the TypeScript typecheck
#   - build  : the React front production build
#
# No Python dependency is installed: the backend relies on the standard
# library only, so the runner interpreter is enough.
# ============================================

name: Tests

on:
  pull_request:

# Cancel a superseded run when the same PR receives a new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only needs to read the repository.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11'

jobs:
  # ==========================================
  # TESTS (Python, standard library only)
  # ==========================================
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run server tests
        run: python -m unittest discover -s server/tests -v

      - name: Run conseiller tests
        run: python -m unittest discover -s conseiller/tests -v

  # ==========================================
  # LINT & FORMATTING (web front)
  # ==========================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: 'true'
          cache_dependency_path: 'web/pnpm-lock.yaml'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Check formatting (Prettier)
        run: pnpm format:check
        working-directory: web

      - name: Lint (ESLint)
        run: pnpm lint
        working-directory: web

      - name: Typecheck (TypeScript)
        run: pnpm typecheck
        working-directory: web

  # ==========================================
  # BUILD (web front)
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: 'true'
          cache_dependency_path: 'web/pnpm-lock.yaml'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Build
        run: pnpm build
        working-directory: web

  # ==========================================
  # WEB TESTS (Vitest, component tests)
  # ==========================================
  web-test:
    name: Web Tests (Vitest)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: 'true'
          cache_dependency_path: 'web/pnpm-lock.yaml'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Run Vitest
        run: pnpm test
        working-directory: web

  # ==========================================
  # SECURITY AUDIT (never blocks the merge)
  # ==========================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [lint, web-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: 'true'
          cache_dependency_path: 'web/pnpm-lock.yaml'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high
        working-directory: web
        continue-on-error: true
